backend:
  name: git-gateway
  branch: main

# Para desarrollo local con Decap CMS:
# local_backend: true

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Noticias"
    label_singular: "Noticia"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Descripción", name: "description", widget: "text", required: false}
      - {label: "Imagen principal", name: "featured", widget: "image", required: false, hint: "Imagen local del post. Se guarda junto al index.md."}
      - {label: "URL de imagen externa", name: "featureimage", widget: "string", required: false}
      - {label: "Contenido", name: "body", widget: "markdown"}
      - {label: "Borrador", name: "draft", widget: "boolean", default: false}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Categorías", name: "categories", widget: "list", required: false}

  - name: "program_pages"
    label: "Páginas de programas"
    label_singular: "Programa"
    files:
      - label: "Acha y Machete"
        name: "acha_y_machete"
        file: "content/programas/acha_y_machete/_index.md"
        fields: &program_fields
          - {label: "Nombre", name: "title", widget: "string"}
          - {label: "Descripción corta", name: "description", widget: "text", required: false}
          - {label: "Fecha", name: "date", widget: "datetime", required: false}
          - {label: "Imagen local", name: "featured", widget: "image", required: false}
          - {label: "URL de imagen externa", name: "featureimage", widget: "string", required: false}
          - label: "Podcast / RSS"
            name: "podcast"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - {label: "Autor", name: "author", widget: "string", required: false}
              - {label: "Nombre propietario", name: "ownerName", widget: "string", required: false, default: "Radio San Javier"}
              - {label: "Email propietario", name: "ownerEmail", widget: "string", required: false, default: "radiosanjavier@gmail.com"}
              - {label: "Descripción podcast", name: "description", widget: "text", required: false}
              - {label: "Categoría", name: "category", widget: "string", required: false, default: "Society & Culture"}
              - {label: "Explícito", name: "explicit", widget: "select", required: false, options: ["no", "yes", "clean"], default: "no"}
              - {label: "Imagen podcast", name: "image", widget: "string", required: false, hint: "URL absoluta recomendada. Para Apple/Spotify conviene imagen cuadrada grande."}
          - {label: "Mostrar fecha", name: "showDate", widget: "boolean", required: false, default: true}
          - {label: "Vista de tarjetas", name: "cardView", widget: "boolean", required: false, default: false}
          - {label: "Agrupar por año", name: "groupByYear", widget: "boolean", required: false, default: false}
          - {label: "Contenido", name: "body", widget: "markdown", required: false}
      - {label: "Caídes del Catre", name: "caides_del_catre", file: "content/programas/caides_del_catre/_index.md", fields: *program_fields}
      - {label: "Contámelo Todo", name: "contamelo_todo", file: "content/programas/contamelo_todo/_index.md", fields: *program_fields}
      - {label: "El Amor Loco", name: "el_amor_loco", file: "content/programas/el_amor_loco/_index.md", fields: *program_fields}
      - {label: "El Horcón de mis Mayores", name: "el_horcon_de_mis_mayores", file: "content/programas/el_horcon_de_mis_mayores/_index.md", fields: *program_fields}
      - {label: "En Espiral", name: "en_espiral", file: "content/programas/en_espiral/_index.md", fields: *program_fields}
      - {label: "Es lo que hay", name: "es_lo_que_hay", file: "content/programas/es_lo_que_hay/_index.md", fields: *program_fields}
      - {label: "Imaginario", name: "imaginario", file: "content/programas/imaginario/_index.md", fields: *program_fields}
      - {label: "Jugosas", name: "jugosas", file: "content/programas/jugosas/_index.md", fields: *program_fields}
      - {label: "La Colectiva", name: "la_colectiva", file: "content/programas/la_colectiva/_index.md", fields: *program_fields}
      - {label: "Recreo", name: "recreo", file: "content/programas/recreo/_index.md", fields: *program_fields}
      - {label: "Retransmisiones", name: "retransmisiones", file: "content/programas/retransmisiones/_index.md", fields: *program_fields}

  - name: "episodios_acha_y_machete"
    label: "Episodios - Acha y Machete"
    label_singular: "Episodio"
    folder: "content/programas/acha_y_machete"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    filter: {field: "cmsType", value: "episode"}
    fields: &episode_fields
      - {label: "Tipo CMS", name: "cmsType", widget: "hidden", default: "episode"}
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Descripción", name: "description", widget: "text", required: false}
      - {label: "Descripción para RSS", name: "rss_description", widget: "text", required: false}
      - {label: "Borrador", name: "draft", widget: "boolean", default: false}
      - {label: "Duración", name: "duration", widget: "string", required: false, hint: "Formato recomendado: HH:MM:SS o MM:SS."}
      - {label: "Imagen local", name: "featured", widget: "image", required: false}
      - {label: "Imagen externa", name: "image", widget: "string", required: false, hint: "URL absoluta de imagen para podcast/OpenGraph."}
      - label: "Archive.org"
        name: "archive"
        widget: "object"
        required: false
        collapsed: false
        fields:
          - {label: "ID de Archive.org", name: "id", widget: "string", required: false, hint: "Ej: acha-y-machete-104-17-7-26.mp-3_202607"}
          - {label: "URL de Archive.org", name: "url", widget: "string", required: false}
          - {label: "Imagen de Archive.org", name: "image", widget: "string", required: false}
      - label: "Audio"
        name: "audio"
        widget: "list"
        required: false
        hint: "Lista simple de URLs directas a MP3. Importante: deben ser strings, no objetos."
        field: {label: "URL MP3", name: "url", widget: "string"}
      - label: "Enclosures RSS"
        name: "enclosures"
        widget: "list"
        required: false
        hint: "Metadata para podcast RSS. Los datos pueden salir de https://archive.org/metadata/ID."
        fields:
          - {label: "URL MP3", name: "url", widget: "string"}
          - {label: "Tipo MIME", name: "type", widget: "string", default: "audio/mpeg"}
          - {label: "Tamaño en bytes", name: "length", widget: "number", value_type: "int", required: false}
      - {label: "Contenido", name: "body", widget: "markdown", required: false, hint: "Para mostrar reproductor de Archive.org, agregar: {{< archive-player id=\"ID_DE_ARCHIVE\" >}}"}
      - {label: "Tags", name: "tags", widget: "list", required: false}

  - name: "episodios_es_lo_que_hay"
    label: "Episodios - Es lo que hay"
    label_singular: "Episodio"
    folder: "content/programas/es_lo_que_hay"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    filter: {field: "cmsType", value: "episode"}
    fields: *episode_fields

  - name: "datos"
    label: "Datos del sitio"
    files:
      - label: "Radio / Streaming"
        name: "radio"
        file: "data/radio.json"
        fields:
          - {label: "Nombre", name: "name", widget: "string"}
          - {label: "Frecuencia", name: "frequency", widget: "string", required: false}
          - {label: "Bajada", name: "tagline", widget: "string", required: false}
          - {label: "URL del streaming", name: "streamUrl", widget: "string"}
          - {label: "Tipo de stream", name: "streamType", widget: "string", default: "audio/mpeg"}
      - label: "Publicidades"
        name: "publicidades"
        file: "data/publicidades.json"
        fields:
          - label: "Anunciantes"
            name: "anunciantes"
            widget: "list"
            fields:
              - {label: "Nombre", name: "nombre", widget: "string"}
              - {label: "Imagen", name: "imagen", widget: "string", hint: "Ej: /publicidades/archivo.svg"}
              - {label: "Link", name: "link", widget: "string", required: false, default: "#"}
              - {label: "Activo", name: "activo", widget: "boolean", default: true}
              - {label: "Ubicaciones", name: "ubicaciones", widget: "list", hint: "Ej: home, es_lo_que_hay"}
