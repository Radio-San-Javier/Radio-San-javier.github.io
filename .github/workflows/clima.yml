name: Actualizar clima

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install requests

      - name: Obtener datos de la estación San Javier
        run: python3 scripts/actualizar_clima.py

      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clima.json
          git diff --cached --quiet || git commit -m "chore: actualizar clima"
          git push
