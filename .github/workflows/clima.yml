name: Actualizar clima

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar datos REM
        run: |
          curl --retry 3 --retry-delay 5 --max-time 60 \
            -A "Mozilla/5.0" \
            "https://rem.cba.gov.ar/Server/descargas/mediciones_flat.json?nocache=$(date +%s)" \
            -o /tmp/mediciones.json
          echo "Descargado: $(wc -c < /tmp/mediciones.json) bytes"

      - name: Procesar datos de la estación San Javier
        run: python3 scripts/actualizar_clima.py /tmp/mediciones.json

      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clima.json
          git diff --cached --quiet || git commit -m "chore: actualizar clima"
          git push
