name: Actualizar clima

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Obtener datos de la estación San Javier
        run: |
          curl -sf "https://rem.cba.gov.ar/Server/descargas/mediciones_flat.json?nocache=$(date +%s)" \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          est = next((e for e in data if e['id'] == '30551'), None)
          if not est:
              raise SystemExit('Estación 30551 no encontrada')
          out = {
              'Temperatura': est['Temperatura'],
              'Humedad': est['Humedad'],
              'Velocidad de Viento': est['Velocidad de Viento'],
              'Registro de lluvia': est['Registro de lluvia'],
          }
          with open('data/clima.json', 'w') as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
          print('Temperatura:', round(est['Temperatura'], 1), 'C')
          "

      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clima.json
          git diff --cached --quiet || git commit -m "chore: actualizar clima"
          git push
