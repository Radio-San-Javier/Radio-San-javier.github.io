name: Actualizar clima

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar datos Open-Meteo
        run: |
          curl --fail --retry 3 --retry-delay 5 --max-time 60 \
            "https://api.open-meteo.com/v1/forecast?latitude=-32.02&longitude=-65.03&current=temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation&wind_speed_unit=ms&precipitation_unit=mm&timezone=America%2FArgentina%2FCordoba" \
            -o /tmp/clima-openmeteo.json
          echo "Descargado: $(wc -c < /tmp/clima-openmeteo.json) bytes"

      - name: Procesar clima de San Javier, Córdoba
        run: python3 scripts/actualizar_clima.py /tmp/clima-openmeteo.json

      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clima.json
          if git diff --cached --quiet; then
            echo "Sin cambios para commitear"
          else
            git commit -m "chore: actualizar clima"
            git push
          fi
